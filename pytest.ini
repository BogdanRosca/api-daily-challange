[pytest]
pythonpath = .
testpaths = tests
addopts = -p no:cacheprovider
log_level = INFO
log_format = %(levelname)s %(name)s: %(message)s
markers =
    smoke: smoke suite
    sites: site registry and area tests
    tenders: tender pricing tests
    hedges: hedge upload tests
    invoices: billing tests
    forecasts: forecast upload tests
    contracts: supply contract tests
    contacts: site contact tests
    consumption: daily read and consumption tests
    alerts: alert rule and evaluation tests
    meters: meter and meter-reading tests
